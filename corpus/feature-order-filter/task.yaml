schema_version: 1
id: feature-order-filter
version: '2.0'
category: feature
description: 'Implement filter_orders.py: read orders.json; filter by required --status and numeric --minimum
  total (inclusive); emit exactly one JSON array containing the matching full records, in input order.
  With no matches, emit an empty JSON array. Implement the general filter for arbitrary arrays of records,
  empty inputs, unknown status, negative and fractional totals, and nonempty pending results; preserve
  any extra fields. JSON object keys must be unique.'
fixture: fixture
setup: []
allowed_tools:
- read_file
- write_file
- shell
- finish
network: none
runtime_seconds: 30
max_tool_steps: 20
token_budget: null
cost_budget_usd: null
verifier:
- python
- /verifier/check.py
expected_artifacts:
- filter_orders.py
cleanup: always
